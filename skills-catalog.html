/* ---------- 渲染 ---------- */
const tree = document.getElementById('tree');
const emptyEl = document.getElementById('empty');
const statEl = document.getElementById('stat');
let total = 0, visible = 0;

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

function renderNode(node, lv, q){
  total++;
  const li = document.createElement('li');
  const hasChildren = node.c && node.c.length;
  const tw = document.createElement('span'); tw.className='tw'; tw.textContent = hasChildren?'▸':'·';
  const nodeDiv = document.createElement('div'); nodeDiv.className='node';
  const name = document.createElement('span'); name.className='name lv'+Math.min(lv,3);
  name.innerHTML = hl(node.n, q);
  nodeDiv.appendChild(tw); nodeDiv.appendChild(name);

  const meta = document.createElement('div'); meta.className='meta';
  let parts=[];
  if(node.tags) parts.push('<span class="tags">'+node.tags.map(t=>'<span class="t">'+t+'</span>').join('')+'</span>');
  if(node.skills) parts.push('<span class="skill">★ '+node.skills.map(s=>esc(s)).join('、')+'</span>');
  if(node.src) parts.push('<span class="src">↗ '+esc(node.src)+'</span>');
  meta.innerHTML = parts.join(' ');
  if(parts.length) nodeDiv.appendChild(meta);

  li.appendChild(nodeDiv);

  let childUl=null;
  if(hasChildren){
    childUl=document.createElement('ul'); childUl.className='hidden';
    node.c.forEach(ch=>childUl.appendChild(renderNode(ch, lv+1, q)));
    li.appendChild(childUl);
    tw.onclick=(e)=>{e.stopPropagation(); childUl.classList.toggle('hidden'); tw.textContent=childUl.classList.contains('hidden')?'▸':'▾';};
  }
  // search: auto-expand if match in subtree
  if(q){
    const hay = (node.n+' '+(node.skills||[]).join(' ')+' '+(node.src||'')+' '+(node.tags||[]).join(' ')).toLowerCase();
    const match = hay.includes(q.toLowerCase());
    if(match){ visible++; li.classList.remove('hidden'); if(childUl){childUl.classList.remove('hidden'); tw.textContent='▾';} }
    else { li.classList.add('hidden'); }
  } else { visible++; }
  return li;
}

function rebuild(q){
  total=0; visible=0;
  tree.innerHTML='';
  const rootUl=document.createElement('ul'); rootUl.style.borderLeft='none'; rootUl.style.paddingLeft='0';
  TAX.forEach(node=>rootUl.appendChild(renderNode(node,0,q)));
  tree.appendChild(rootUl);
  emptyEl.classList.toggle('hidden', visible>0);
  statEl.textContent = q ? ('命中 '+visible+' 项') : ('共 '+total+' 个分类节点');
  return rootUl;
}

let rootUl = rebuild('');

document.getElementById('q').addEventListener('input', e=>{
  const q=e.target.value.trim();
  rootUl = rebuild(q);
});
document.getElementById('expand').onclick=()=>{rootUl.querySelectorAll('ul').forEach(u=>u.classList.remove('hidden')); rootUl.querySelectorAll('.tw').forEach(t=>t.textContent='▾');};
document.getElementById('collapse').onclick=()=>{rootUl.querySelectorAll('ul').forEach(u=>u.classList.add('hidden')); rootUl.querySelectorAll('.tw').forEach(t=>t.textContent='▸');};
</script>
